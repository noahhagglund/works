<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noah Hägglund — Sound Designer</title>
<meta name="description" content="Noah Hägglund — Sound Designer & Music Maker based in Stockholm, Sweden.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Lora:ital@0;1&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #000000;
  --text: #E9E7E2;
  --muted: #ABA8A2;
  --accent: #E29569;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px;
  text-align: center;
}

nav {
  position: absolute;
  top: 48px;
  left: 48px;
  font-size: 1.4rem;
}

nav a {
  color: var(--accent);
  text-decoration: none;
}

.message h1 {
  font-family: 'Lora', serif;
  font-weight: 400;
  font-size: clamp(2rem, 5vw, 4rem);
  line-height: 1.15;
  margin-bottom: 10px;
}

.message p {
  color: var(--muted);
  font-size: 0.9rem;
}

footer {
  position: absolute;
  bottom: 32px;
  left: 0;
  width: 100%;
}

footer p {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 800px) {

  .page {
    padding: 32px 24px;
  }

  nav {
    top: 32px;
    left: 24px;
    font-size: 1.2rem;
  }

  .message h1 {
    font-size: 2.5rem;
  }

}

</style>
</head>

<body>

<div class="page">

  <nav>
    <a href="#">Noah Hägglund</a>
  </nav>

  <main>

    <div class="message">

      <h1>gone fishing</h1>

      <p>back soon.</p>

    </div>

  </main>

</div>

<footer>
  <p>© 2026 Noah Hägglund</p>
</footer>

</body>
</html>
