<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noah Hägglund — Sound Designer</title>
<meta name="description" content="Noah Hägglund — Sound Designer & Music Maker based in Stockholm, Sweden.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Lora:ital@0;1&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #000000;
  --text: #E9E7E2;
  --muted: #ABA8A2;
  --accent: #E29569;
  --line: #3A3A38;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  max-width: 1600px;
  margin: 0 auto;
  padding: 64px 48px;
  gap: 24px;
}

nav {
  font-size: 1.4rem;
}

nav a {
  display: block;
  color: var(--accent);
  text-decoration: none;
}

main {
  display: flex;
  align-items: center;
  min-height: calc(100vh - 128px);
}

.message {
  max-width: 700px;
}

.message h1 {
  font-family: 'Lora', serif;
  font-weight: 400;
  font-size: clamp(2rem, 5vw, 4rem);
  line-height: 1.15;
  margin-bottom: 24px;
}

.message p {
  color: var(--muted);
  font-size: 1rem;
  max-width: 500px;
}

footer {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 96px);
  max-width: 1504px;
}

footer p {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 800px) {

  .page {
    grid-template-columns: 1fr;
    padding: 32px 24px;
    gap: 48px;
  }

  main {
    min-height: auto;
    padding-top: 20vh;
  }

  footer {
    width: calc(100% - 48px);
  }

}

</style>
</head>

<body>

<div class="page">

  <nav>
    <a href="#">noah</a>
  </nav>

  <main>

    <div class="message">

      <h1>under construction</h1>

      <p>
        sound designer &amp; music maker based in Stockholm, Sweden.
      </p>

    </div>

  </main>

</div>

<footer>
  <p>© 2026 Noah Hägglund</p>
</footer>

</body>
</html>
